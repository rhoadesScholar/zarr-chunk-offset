[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zarr-chunk-offset"
version = "0.1.0"
description = "The `offset` chunk key encoding for Zarr v3: grow an array in the negative direction by whole chunks as a metadata-only edit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jeff Rhoades", email = "rhoadesj@alumni.harvard.edu" }]
keywords = ["zarr", "chunk key encoding", "zarr-extension"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["zarr>=3.1.3"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy"]

[project.urls]
Repository = "https://github.com/rhoadesScholar/zarr-chunk-offset"

[project.entry-points."zarr.chunk_key_encoding"]
offset = "zarr_chunk_offset:OffsetChunkKeyEncoding"

[tool.hatch.build.targets.wheel]
packages = ["src/zarr_chunk_offset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
